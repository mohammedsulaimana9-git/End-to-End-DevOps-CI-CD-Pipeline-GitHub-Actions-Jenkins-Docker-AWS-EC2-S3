name: GitHub Actions Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          pip install -r requirements.txt 2>&1 | tee pipeline1.log

      - name: Run basic test
        id: syntax
        continue-on-error: true
        run: |
          python -m py_compile app.py 2>&1 | tee -a pipeline1.log

      - name: Validate Docker build
        id: docker
        continue-on-error: true
        run: |
          docker build -t myapp . 2>&1 | tee -a pipeline1.log

      - name: Send failure mail with log
        if: steps.install.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.docker.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Pipeline 1 Failed - GitHub Actions Error"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            Pipeline 1 failed.

            Please check the attached pipeline1.log file for the error details.
          attachments: pipeline1.log

      - name: Stop pipeline if validation failed
        if: steps.install.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.docker.outcome == 'failure'
        run: exit 1

      - name: Trigger Jenkins Pipeline 2
        run: |
          curl -X POST "${{ secrets.JENKINS_URL }}/job/Pipeline%202%20(Build%20and%20Test)/build" \
          --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}"

      - name: Mail success
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Pipeline 1 Success - Jenkins Pipeline 2 Triggered"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            Pipeline 1 GitHub Actions validation completed successfully.

            It checked:
            - Code checkout
            - Python dependencies
            - Python syntax validation
            - Docker image build

            Jenkins Pipeline 2 has now been triggered and is running.